<script>
"use strict";
/* ===== MOTEUR DE RÈGLES : programmation adaptable (aucun hasard : mêmes données = même plan) ===== */
const KINDS = {
  PPI:{n:"PP individuelle", c:"pp", fam:["LUN_PP","JEU_PP","SAM_PP","ETE_PP","SAM_PPC"]},
  PPC:{n:"PP collective", c:"pp", fam:["SAM_PPC","LUN_PP","JEU_PP","SAM_PP","ETE_PP"]},
  TI: {n:"Tennis individuel (biomécanique)", c:"tb", fam:["MAR_TB","JEU_TB","SAM_TB","ETE_TB"]},
  TC: {n:"Tennis collectif", c:"ten", fam:["LUN_TEN","MER_TEN","VEN_TEN","SAM_TENC","ETE_TEN"]},
  PM: {n:"Préparation mentale", c:"pm", fam:["MAR_PM"]}
};
const KORD = ["PPI","PPC","TI","TC","PM"];
const JOURS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const JC = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const PHN = {G:"Préparation générale", S:"Préparation spécifique", P:"Pré-compétition", C:"Compétition", R:"Récupération", T:"Transition"};
const PHC = {G:"#0F766E", S:"#1D4ED8", P:"#B7791F", C:"#B91C1C", R:"#7C3AED", T:"#94A3B8"};
const MOIS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const CLASSEMENTS = ["NC","40","30/5","30/4","30/3","30/2","30/1","30","15/5","15/4","15/3","15/2","15/1","15","5/6","4/6","3/6","2/6","1/6","0","-2/6","-4/6","-15","-30","Top 60","Top 40"];
const NIVN = ["Départemental","Régional","National","International"];
// seuils (index dans CLASSEMENTS) : [régional, national, international] selon l'âge
function seuils(age){ return age<=10?[2,6,9]: age<=12?[5,10,13]: age<=14?[8,13,16]: age<=16?[11,15,19]:[13,17,21]; }
function niveauDe(cl, age){ const i = CLASSEMENTS.indexOf(cl); if(i<0) return 0; const s = seuils(age); return i>=s[2]?3: i>=s[1]?2: i>=s[0]?1:0; }

/* ---- dates (UTC, sans décalage d'heure) ---- */
const DAY = 864e5;
const pd = s => { const [y,m,d] = s.split("-").map(Number); return Date.UTC(y,m-1,d); };
const iso = t => new Date(t).toISOString().slice(0,10);
const monday = t => t - ((new Date(t).getUTCDay()+6)%7)*DAY;
const fd = t => { const d = new Date(t); return d.getUTCDate()+" "+MOIS[d.getUTCMonth()]; };
const fdy = t => { const d = new Date(t); return d.getUTCDate()+" "+MOIS[d.getUTCMonth()]+" "+d.getUTCFullYear(); };
function ageAt(nai, ref){ if(!nai) return null; const a=new Date(pd(nai)), r=new Date(ref); let y=r.getUTCFullYear()-a.getUTCFullYear(); if(r.getUTCMonth()<a.getUTCMonth()||(r.getUTCMonth()===a.getUTCMonth()&&r.getUTCDate()<a.getUTCDate())) y--; return y; }
const overlap = (a1,a2,b1,b2) => Math.max(0, Math.min(a2,b2)-Math.max(a1,b1)+DAY)/DAY;

/* ---- zones fragiles : mots qui pénalisent un thème de PP ---- */
const ZONES = {
  dos:{n:"Dos", r:/charnière|chargée|médecine-ball|lancer|rotation|extension|cambr|hyperext/i, v:"Dos : pas de charge sur la colonne, priorité au gainage et à la mobilité des hanches."},
  genou:{n:"Genou", r:/saut|bond|pliom|réception|fente|flexion des jambes|freinage|profondeur/i, v:"Genou : volume de sauts et de freinages réduit, genou dans l'axe à chaque appui."},
  talon:{n:"Talon", r:/saut|bond|pliom|sautill|corde|sprint|réception/i, v:"Talon : pas de sauts répétés ni de sprints sur sol dur pendant la douleur."},
  epaule:{n:"Épaule", r:/lancer|médecine|poussée|tirage|suspension|au-dessus de la tête|haut du corps/i, v:"Épaule : volume de service et de lancers réduit, travail de stabilité de l'omoplate."},
  poignet:{n:"Poignet", r:/appui sur les mains|pompe|médecine|lancer|quadrupédie/i, v:"Poignet : pas d'appui sur les mains, pas de lancers lourds."},
  hanche:{n:"Hanche", r:/fente|écart|charnière|grand pas|glissade/i, v:"Hanche : amplitudes progressives, pas de grands écarts forcés."}
};
const R_CROIS = /chargée|profondeur|pliom|bonds? répétés|haute intensité|choc/i;

function capFor(age, niv, crois){
  let c = age<=10?3: age<=12?4: age<=14?4:5;
  if(age>=13 && niv>=2 && !crois) c = Math.min(5, c+1);
  if(crois) c = Math.max(2, c-1);
  return c;
}

/* ---- lignes faibles d'après l'appli Grilles (dernier bilan, niveau 1 ou 2) ---- */
function lignesFaibles(j){
  if(!j || !Array.isArray(j.bilans) || !j.bilans.length) return [];
  const b = [...j.bilans].sort((a,b)=>a.date<b.date?1:-1)[0], out=[];
  for(const d of ["PP","GE","DE"]) (b.v?.[d]||[]).forEach((v,i)=>{ if(v && v<=2) out.push(d+(i+1)); });
  return out;
}

/* ================= GÉNÉRATION ================= */
function generer(plan, joueur, profil, DATA){
  const nai = joueur?.naissance;
  let age = plan.age || ageAt(nai, pd(plan.debut)) || 13; age = Math.max(8, Math.min(18, age));
  const sexe = joueur?.sexe==="G" ? "G" : "F";
  const code = sexe + String(age).padStart(2,"0");
  const REF = DATA.refs[code] || DATA.refs[sexe+String(age)] ;
  const niv = niveauDe(profil.classement||"NC", age);
  const crois = !!profil.croissance, zones = profil.zones||[];
  const cap = capFor(age, niv, crois);
  const faibles = [...new Set([...(profil.prio||[]), ...(plan.sansGrilles?[]:lignesFaibles(joueur))])];

  // 1. semaines
  const m0 = monday(pd(plan.debut)), mE = monday(pd(plan.fin));
  const N = Math.max(1, Math.min(60, Math.round((mE-m0)/(7*DAY))+1));
  const W = [];
  for(let i=0;i<N;i++){
    const d1 = m0+i*7*DAY, d7 = d1+6*DAY, w = {i, d1, d7, iso:iso(d1), comp:[], obj:[], bil:false, off:false, offDays:[]};
    for(const c of plan.compets||[]) if(c.d1&&c.d2&&overlap(d1,d7,pd(c.d1),pd(c.d2))>0) w.comp.push(c.nom||"Tournois");
    for(const o of plan.objs||[]) if(o.d){ const t=pd(o.d); if(t>=d1&&t<=d7) w.obj.push(o.nom||"Objectif"); }
    for(const b of plan.bilans||[]) if(b){ const t=pd(b); if(t>=d1&&t<=d7) w.bil=true; }
    let cd = 0;
    for(const c of plan.coups||[]) if(c.d1&&c.d2){ for(let k=0;k<7;k++){ const t=d1+k*DAY; if(t>=pd(c.d1)&&t<=pd(c.d2) && !w.offDays.includes(k)) { w.offDays.push(k); cd++; } } }
    // jours hors de la période choisie
    for(let k=0;k<7;k++){ const t=d1+k*DAY; if((t<pd(plan.debut)||t>pd(plan.fin)) && !w.offDays.includes(k)) w.offDays.push(k); }
    if(cd>=4 || plan.over?.[w.iso]==="off") w.off = true;
    W.push(w);
  }
  // 2. phases
  const ph = W.map(w => w.off?"T": (w.comp.length||w.obj.length)?"C": null);
  const aff = (age>=13 && niv>=2) ? 2 : 1;
  // récupération après un bloc de tournois
  for(let i=0;i<N;i++) if(ph[i]==="C" && (i+1>=N || ph[i+1]!=="C")){
    let s=i; while(s>0 && ph[s-1]==="C") s--;
    const lg = i-s+1, hasObj = W.slice(s,i+1).some(w=>w.obj.length);
    if(i+1<N && ph[i+1]===null && (lg>=2 || hasObj)) ph[i+1]="R";
  }
  // affûtage avant un objectif, pré-compétition avant un bloc
  for(let i=0;i<N;i++){
    if(W[i].obj.length) for(let a=1;a<=aff;a++){ if(i-a>=0 && ph[i-a]===null) ph[i-a]="P"; else break; }
    if(ph[i]==="C" && (i===0 || (ph[i-1]!=="C"&&ph[i-1]!=="P")) && i-1>=0 && ph[i-1]===null) ph[i-1]="P";
  }
  // préparation générale / spécifique sur les blocs libres
  for(let i=0;i<N;){
    if(ph[i]!==null){ i++; continue; }
    let j=i; while(j+1<N && ph[j+1]===null) j++;
    const L=j-i+1, avantCompet = j+1<N && (ph[j+1]==="P"||ph[j+1]==="C");
    let nS = avantCompet ? (L<=2?L: Math.min(4, Math.floor(L/2))) : Math.floor(L/2);
    if(N<=2 && !avantCompet) nS = 0;
    for(let k=i;k<=j;k++) ph[k] = (k>j-nS) ? "S" : "G";
    i=j+1;
  }
  // 3. mésocycles (blocs de même phase ; G et S découpés en blocs de 3 à 5 semaines)
  const mesos=[];
  for(let i=0;i<N;){
    let j=i; while(j+1<N && ph[j+1]===ph[i]) j++;
    const L=j-i+1;
    if((ph[i]==="G"||ph[i]==="S") && L>5){
      const k=Math.ceil(L/4), base=Math.floor(L/k); let r=L%k, a=i;
      for(let q=0;q<k;q++){ const n=base+(r>0?1:0); r--; mesos.push({t:ph[i],a,b:a+n-1}); a+=n; }
    } else mesos.push({t:ph[i],a:i,b:j});
    i=j+1;
  }
  // 4. microcycles et charges
  const jeune = age<=12 || crois;
  for(const m of mesos){
    const n=m.b-m.a+1;
    for(let k=0;k<n;k++){
      const w=W[m.a+k]; w.ph=m.t; w.fr=(k+0.5)/n; let mi, c;
      if(m.t==="T"){ mi="Repos"; c=0; }
      else if(m.t==="C"){ mi="Compétition"; c = w.obj.length?2: (niv>=2?3:2); }
      else if(m.t==="P"){ mi="Affûtage"; c=Math.max(2,cap-2); }
      else if(m.t==="R"){ mi="Récupération"; c=Math.min(2,cap); }
      else {
        const pat = n===1?[[ "Développement",0]]: n===2?[["Développement",-1],["Développement",0]]:
          n===3?[["Développement",-1],[jeune?"Développement":"Choc",0],["Entretien",-2]]:
          n===4?[["Développement",-2],["Développement",-1],[jeune?"Développement":"Choc",0],["Entretien",-2]]:
                [["Développement",-2],["Développement",-1],[jeune?"Développement":"Choc",0],["Développement",-1],["Entretien",-2]];
        mi=pat[k][0]; c=cap+pat[k][1];
        if(m.t==="G" && mi==="Choc") c=cap;  // le choc reste au plafond
      }
      w.mi=mi; w.c=Math.max(m.t==="T"?0:1, Math.min(cap, c));
    }
  }
  for(let i=0;i<N;i++){
    const w=W[i];
    if(w.ph!=="T" && w.ph!=="C" && ((i===0 && plan.reprise) || (i>0 && W[i-1].ph==="T"))){ w.mi="Reprise"; w.c=Math.max(1,Math.min(w.c,cap-2)); }
    if(w.bil && w.ph!=="T" && w.ph!=="C"){ w.mi="Bilan"; w.c=Math.min(w.c,2); }
  }
  // objectifs des mésos : repris de la saison de référence (même type, période la plus proche)
  mesos.forEach((m,q)=>{
    m.id="M"+(q+1); m.nom=PHN[m.t];
    const mo = new Date(W[m.a].d1).getUTCMonth()+1;
    const cand = (REF?.m||[]).filter(x=>x.t===m.t);
    const md = x => { const d=Math.abs(x.mo-mo); return Math.min(d,12-d); };
    const best = (cand.length?cand:(REF?.m||[])).slice().sort((x,y)=>md(x)-md(y))[0];
    m.ref = best||null;
  });
  const nb = {}; mesos.forEach(m=>{ nb[m.t]=(nb[m.t]||0)+1; m.num=nb[m.t]; });
  mesos.forEach(m=>{ if(nb[m.t]>1) m.nom += " "+m.num; });
  // 5. macrocycles (> 12 semaines) : chacun se termine après un bloc de tournois
  let macros=[];
  if(N>12){
    let a=0;
    for(let i=0;i<N;i++){
      const finBloc = ph[i]==="C" && (i+1>=N || ph[i+1]!=="C");
      if(finBloc){ let b=i; if(i+1<N && ph[i+1]==="R") b=i+1; macros.push({a,b}); a=b+1; i=b; }
    }
    if(a<N) macros.push({a,b:N-1});
    // fusion des macros trop courts (moins de 4 semaines)
    for(let q=macros.length-1;q>0;q--){ const m=macros[q]; if(m.b-m.a+1<4){ macros[q-1].b=m.b; macros.splice(q,1); } }
    if(macros.length>1 && macros[0].b-macros[0].a+1<4){ macros[1].a=0; macros.shift(); }
    macros.forEach((m,q)=>{
      m.id="Macro "+(q+1);
      const comps=[...new Set(W.slice(m.a,m.b+1).flatMap(w=>[...w.obj,...w.comp]))];
      const objs=[...new Set(W.slice(m.a,m.b+1).flatMap(w=>w.obj))];
      m.cible = objs[0] || comps[0] || "";
      m.nom = m.cible ? "Vers "+m.cible : "Développement";
      m.obj = m.cible ? `Construire les qualités puis arriver frais et affûté sur ${m.cible}.` : "Construire les qualités physiques, le geste et le jeu sans échéance de tournoi.";
    });
  }
  const decoupe = N>12 ? "macro" : N>=3 ? "meso" : "micro";
  // 6. séances de chaque semaine + thèmes
  const used = new Set();
  const refW = (REF?.w||[]).filter(r=>Object.keys(r.s).length);
  for(const w of W){
    w.ses=[];
    if(w.off) continue;
    const ov = plan.over?.[w.iso];
    const base = Array.isArray(ov) ? ov : (plan.sem||[]);
    const list = base.filter(s=>!w.offDays.includes(s.j)).slice().sort((x,y)=>x.j-y.j || KORD.indexOf(x.k)-KORD.indexOf(y.k));
    const cnt={};
    for(const s of list){
      const key = w.iso+"|"+s.j+"|"+s.k+"|"+(cnt[s.j+s.k]=(cnt[s.j+s.k]||0)+1);
      const se = {j:s.j, k:s.k, key};
      const ed = plan.edits?.[key];
      if(w.ph==="C" && s.j>=5 && !ed){ se.t="Tournoi : matchs, routines d'avant-match et récupération entre les tours"; se.l=[]; se.tour=true; w.ses.push(se); continue; }
      const pool = candidats(w, s.k, s.j, refW, faibles, zones, crois);
      let pick = pool.find(p=>!used.has(p.t)) || pool[0];
      se.auto = pick ? {t:pick.t, l:pick.l} : {t:"Thème libre", l:[]};
      if(pick) used.add(pick.t);
      if(ed){ se.t=ed.t; se.l=ed.l||[]; se.edit=true; } else { se.t=se.auto.t; se.l=se.auto.l; }
      w.ses.push(se);
    }
  }
  // 7. vigilance
  const vig = [...(REF?.vig||[])];
  if(crois) vig.unshift("Pic de croissance : charge plafonnée plus bas, pas de sauts en profondeur ni de charge lourde, surveiller genou, talon et dos.");
  zones.forEach(z=>ZONES[z] && vig.unshift(ZONES[z].v));
  return {W, N, mesos, macros, decoupe, age, sexe, code, REF, niv, cap, crois, zones, faibles, aff};
}

function candidats(w, k, j, refW, faibles, zones, crois){
  const fam = KINDS[k].fam, mo = new Date(w.d1).getUTCMonth()+1, out=[], seen=new Set();
  const scored = refW.map(r=>{
    const md = Math.min(Math.abs(r.mo-mo), 12-Math.abs(r.mo-mo));
    let s = (r.m===w.ph?4:0) + (r.mi===w.mi?3:0) + (md===0?1.5: md===1?0.7:0) - 2*Math.abs((r.fr||0.5)-(w.fr||0.5));
    if(w.ph==="G"||w.ph==="S"){ if(r.m==="G"||r.m==="S") s+=1; }
    if(w.mi==="Bilan" && r.mi==="Bilan") s+=2;
    return {r,s};
  }).sort((a,b)=>b.s-a.s);
  const pp = KINDS[k].c==="pp";
  for(const {r,s} of scored){
    fam.forEach((sl,fi)=>{
      const x=r.s[sl]; if(!x) return; const t=x[0];
      if(seen.has(t)) return;
      if(/^tournoi/i.test(t)) return;
      const isBil = /^bilan/i.test(t);
      if(isBil && w.mi!=="Bilan") return;
      let sc = s - fi*0.3 + (isBil?5:0);
      const md2=Math.min(Math.abs(r.mo-mo),12-Math.abs(r.mo-mo));
      if(md2>1 && /no[eë]l|été|rentrée|toussaint|vacances|hiver|printemps|fêtes/i.test(t)) sc -= 5;
      if(/^reprise|retour de/i.test(t) && w.mi!=="Reprise" && r.mi==="Reprise") sc -= 3;
      if(faibles.length && x[1].some(l=>faibles.includes(l))) sc += 1.5;
      if(pp){ for(const z of zones) if(ZONES[z]?.r.test(t)) sc -= 6; if(crois && R_CROIS.test(t)) sc -= 4; }
      if(KINDS[k].c==="tb" && zones.includes("epaule") && /service|smash/i.test(t)) sc -= 3;
      seen.add(t); out.push({t, l:x[1], sc, sl});
    });
  }
  return out.sort((a,b)=>b.sc-a.sc);
}

if(false&&typeof module!=="undefined") module.exports = {generer, candidats, niveauDe, KINDS, CLASSEMENTS, ageAt, pd, iso, monday};

/* ===== MiniPDF : vrai fichier PDF fabriqué sur l'appareil, sans bibliothèque (Helvetica, A4) ===== */
const MiniPDF = (()=>{
  const CP = {"€":128,"‚":130,"ƒ":131,"„":132,"…":133,"†":134,"‡":135,"ˆ":136,"‰":137,"Š":138,"‹":139,"Œ":140,"Ž":142,"‘":145,"’":146,"“":147,"”":148,"•":149,"–":150,"—":151,"˜":152,"™":153,"š":154,"›":155,"œ":156,"ž":158,"Ÿ":159};
  const SUB = {"→":"->","←":"<-","≤":"<=","≥":">=","✓":"OK","★":"*","ⓘ":"i","✎":""," ":" "," ":" ","‑":"-","≈":"~","×":"×","…":"…","Δ":"D","°":"°"};
  function enc(s){ let o=""; for(const ch of String(s??"")){ let c=ch; if(c.charCodeAt(0)>255 && !(c in CP) && SUB[c]!=null) c=SUB[c]; for(const k of c){ const n=k.charCodeAt(0); if(n<256) o+=k; else if(CP[k]) o+=String.fromCharCode(CP[k]); else o+="?"; } } return o.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)"); }
  let ctx=null;
  function width(s,size,bold){ if(!ctx){ ctx=document.createElement("canvas").getContext("2d"); } ctx.font=(bold?"bold ":"")+"100px Helvetica, Arial, sans-serif"; return ctx.measureText(String(s)).width/100*size*1.02; }
  function hex(c){ const m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(c||"#000000"); return m?[1,2,3].map(i=>(parseInt(m[i],16)/255).toFixed(3)).join(" "):"0 0 0"; }
  class Doc{
    constructor(opt={}){ this.W=opt.landscape?842:595; this.H=opt.landscape?595:842; this.M=opt.margin||36; this.pages=[]; this.addPage(); }
    addPage(){ this.cur=[]; this.pages.push(this.cur); this.y=this.M; return this; }
    text(x,y,s,o={}){ const sz=o.size||10; this.cur.push(`BT /${o.bold?"F2":"F1"} ${sz} Tf ${hex(o.color)} rg ${x.toFixed(2)} ${(this.H-y-sz*0.8).toFixed(2)} Td (${enc(s)}) Tj ET`); }
    rect(x,y,w,h,o={}){ const c=[]; if(o.fill) c.push(hex(o.fill)+" rg"); if(o.stroke) c.push(hex(o.stroke)+" RG "+(o.lw||0.6)+" w"); c.push(`${x.toFixed(2)} ${(this.H-y-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re ${o.fill&&o.stroke?"B":o.fill?"f":"S"}`); this.cur.push(c.join(" ")); }
    line(x1,y1,x2,y2,o={}){ this.cur.push(`${hex(o.color||"#C8CDD4")} RG ${o.lw||0.6} w ${x1.toFixed(2)} ${(this.H-y1).toFixed(2)} m ${x2.toFixed(2)} ${(this.H-y2).toFixed(2)} l S`); }
    wrap(s,size,maxw,bold){ const out=[]; for(const para of String(s??"").split("\n")){ let line=""; for(const w of para.split(/\s+/)){ if(!w) continue; const t=line?line+" "+w:w; if(width(t,size,bold)<=maxw||!line) line=t; else { out.push(line); line=w; } } out.push(line); } return out; }
    need(h){ if(this.y+h>this.H-this.M) { this.addPage(); return true; } return false; }
    /* paragraphe avec retour à la ligne et saut de page automatique */
    para(s,o={}){ const sz=o.size||10, lh=sz*(o.lh||1.3), x=o.x??this.M, w=o.w??(this.W-this.M-x); for(const l of this.wrap(s,sz,w,o.bold)){ this.need(lh); this.text(x,this.y,l,o); this.y+=lh; } this.y+=o.after??2; }
    out(){
      const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
      add("<< /Type /Catalog /Pages 2 0 R >>"); add("PAGES");
      add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
      add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
      const kids=[];
      for(const p of this.pages){ const st=p.join("\n"); const c=add(`<< /Length ${st.length} >>\nstream\n${st}\nendstream`); kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.W} ${this.H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${c} 0 R >>`)); }
      objs[1]=`<< /Type /Pages /Kids [${kids.map(k=>k+" 0 R").join(" ")}] /Count ${kids.length} >>`;
      let s="%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"; const off=[];
      objs.forEach((o,i)=>{ off.push(s.length); s+=`${i+1} 0 obj\n${o}\nendobj\n`; });
      const x=s.length; s+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
      const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i)&255; return new Blob([b],{type:"application/pdf"});
    }
  }
  /* remise du fichier : feuille de partage (Imprimer, Enregistrer dans Fichiers…) sinon téléchargement */
  async function deliver(blob,name){
    const file=new File([blob],name,{type:"application/pdf"});
    try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return "share"; } }catch(e){ if(e && e.name==="AbortError") return "abort"; }
    const u=URL.createObjectURL(blob), a=document.createElement("a"); a.href=u; a.download=name; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove();
    return "download";
  }
  return {Doc, deliver, width};
})();

/* ===== PARTAGE PAR LIEN : l'objet voyage dans l'adresse (#x/…), compressé quand l'appareil le permet ===== */
const Partage = (()=>{
  const toB64=u8=>{ let s=""; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
  const fromB64=s=>{ const b=atob(s.replace(/-/g,"+").replace(/_/g,"/")); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; };
  async function pipe(u8,T){ const st=new Blob([u8]).stream().pipeThrough(T); return new Uint8Array(await new Response(st).arrayBuffer()); }
  async function enc(obj){
    const raw=new TextEncoder().encode(JSON.stringify(obj));
    try{ if(window.CompressionStream) return "z"+toB64(await pipe(raw,new CompressionStream("deflate-raw"))); }catch(e){}
    return "p"+toB64(raw);
  }
  async function dec(code){
    const k=code[0], u=fromB64(code.slice(1));
    const raw = k==="z" ? await pipe(u,new DecompressionStream("deflate-raw")) : u;
    return JSON.parse(new TextDecoder().decode(raw));
  }
  async function envoyer(obj,titre,texte,openSheet,esc){
    const url=location.origin+location.pathname+"#x/"+await enc(obj);
    try{ if(navigator.share){ await navigator.share({title:titre,text:texte,url}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
    let ok=false; try{ await navigator.clipboard.writeText(url); ok=true; }catch(e){}
    openSheet(`<div class="shh"><b>${esc(titre)}</b><button class="ib" data-close type="button">×</button></div><p class="msg">${ok?"Lien copié. ":""}Colle ce lien dans un message : il ouvre directement la même chose sur le téléphone de la personne.</p><textarea class="srch" rows="5" readonly>${esc(url)}</textarea>`);
  }
  return {enc,dec,envoyer};
})();

function presetSem(t){
  const P13=[[0,"PPI"],[0,"TC"],[1,"PM"],[1,"TI"],[2,"TC"],[3,"PPI"],[3,"TI"],[4,"TC"],[5,"PPI"],[5,"TI"]];
  const P11=[[0,"PPI"],[0,"TC"],[1,"PM"],[1,"TI"],[2,"TC"],[3,"PPI"],[3,"TI"],[5,"PPC"],[5,"TC"]];
  return (t==="13"?P13:t==="11"?P11:[]).map(([j,k])=>({j,k}));
}

function frise(R){

    $("#woff").onchange=e=>{ cur = e.target.checked ? "off" : p.sem.map(x=>({...x})); draw(); };
    $$("[data-si]",sheet).forEach(b=>b.onclick=()=>{ cur.splice(+b.dataset.si,1); draw(); });
    $$("[data-add]",sheet).forEach(b=>b.onclick=()=>{ b.nextElementSibling.hidden=!b.nextElementSibling.hidden; });
    $$(".menu [data-k]",sheet).forEach(b=>b.onclick=()=>{ cur.push({j:+b.closest(".wkd").querySelector("[data-add]").dataset.add, k:b.dataset.k}); draw(); });
    $("#wok").onclick=()=>{ p.over[w.iso]=cur; p.maj=todayIso(); saveNow(); closeSheet(); showPlan(p.id,"w"+w.i); };
    $("#wre").onclick=()=>{ delete p.over[w.iso]; saveNow(); closeSheet(); showPlan(p.id,"w"+w.i); };
  };
  draw();
}

/* ---------- RÈGLES ---------- */
function showMethode(){
  main.innerHTML=`<div class="crumb"><a href="#">Accueil</a> › Règles</div><h1>Les règles de la méthode</h1>
  <div class="doc"><div class="ess"><h2>L'essentiel</h2><p>Le plan part toujours de la saison de référence de l'âge et du sexe du joueur (8 à 18 ans), puis l'adapte à sa situation réelle. Mêmes données = même plan : rien n'est tiré au hasard.</p></div>
  <h2>Découpe selon la durée</h2><ul><li>Plus de 12 semaines : macrocycles, mésocycles, microcycles et séances.</li><li>3 à 12 semaines : mésocycles, microcycles et séances.</li><li>1 ou 2 semaines : microcycles et séances.</li></ul>
  <h2>Phases</h2><ul><li>Semaine qui touche une période de tournois ou un objectif : <b>Compétition</b> (week-end = tournoi).</li><li>Avant un objectif : <b>Pré-compétition</b> (affûtage), 2 semaines au niveau national et international à partir de 13 ans, 1 semaine sinon. Une semaine avant chaque période de tournois.</li><li>Après un bloc de tournois de 2 semaines ou plus, ou après un objectif : 1 semaine de <b>Récupération</b>.</li><li>Entre deux : <b>Préparation générale</b> puis <b>Préparation spécifique</b> (jusqu'à 4 semaines avant les tournois), en mésocycles de 3 à 5 semaines.</li><li>Coupure de 4 jours ou plus : semaine de <b>Repos</b> ; la suivante est une reprise.</li></ul>
  <h2>Charges</h2><ul><li>Plafond : 3 à 8-10 ans, 4 à 11-14 ans, 5 à 15-18 ans ; +1 à 13-14 ans au niveau national et plus ; −1 en pic de croissance.</li><li>Dans un méso de préparation : montée sur 2 ou 3 semaines puis semaine allégée. Choc seulement à partir de 13 ans et hors croissance.</li></ul>
  <h2>Niveau d'après le classement</h2><p>Le même classement ne veut pas dire la même chose à 10 ans et à 17 ans : le niveau (départemental, régional, national, international) est déduit selon l'âge.</p>
  <h2>Choix des thèmes</h2><ul><li>Pour chaque séance, l'appli cherche dans la saison de référence les semaines de même phase, même microcycle et même période de l'année.</li><li>Elle privilégie les thèmes qui touchent les lignes prioritaires (bilan Grilles et lignes cochées).</li><li>Elle écarte les thèmes à risque pour les zones fragiles et en pic de croissance.</li><li>Pas deux fois le même thème dans un plan tant qu'il en reste d'autres.</li><li>Tu peux toucher n'importe quel thème pour le réécrire ou choisir parmi d'autres thèmes qui conviennent ; tes retouches sont gardées quand le plan se recalcule.</li></ul></div>`;
}

/* ---------- PLAN REÇU PAR LIEN ---------- */
async function recevoir(code){
  try{ const d=await Partage.dec(code); const J=joueurs();
    let j=J.joueurs.find(x=>x.nom===d.j.nom && (x.naissance||"")===d.j.naissance);
    if(!j){ j={id:uid(),nom:d.j.nom,sexe:d.j.sexe,naissance:d.j.naissance,groupe:"",notes:"",bilans:[]}; J.joueurs.push(j); saveJoueurs(J); }
    if(!ST.profils[j.id]) ST.profils[j.id]=d.pr||{classement:"NC",croissance:false,zones:[],prio:[]};
    const p=d.p; p.id=uid(); p.jid=j.id; p.maj=todayIso(); ST.plans.push(p); saveNow(); location.replace("#p/"+p.id); }
  catch(e){ main.innerHTML=`<div class="empty">Ce lien de plan est abîmé. Demande qu'on te le renvoie.</div>`; }
}

/* ---------- ROUTAGE ---------- */
function route(){
  const h=decodeURIComponent(location.hash.slice(1)); const [a,b,c]=h.split("/");
  closeSheet();
  if(a==="x"&&b){ recevoir(b); return; }
  if(a==="j"&&b) showJoueur(b); else if(a==="e"&&b) showEdit(b); else if(a==="p"&&b) showPlan(b,c); else if(a==="m") showMethode(); else showHome();
  if(!c) window.scrollTo(0,0);
  $("#back").style.visibility = a ? "visible" : "hidden";
}
addEventListener("hashchange", route);
addEventListener("storage", e=>{ if(e.key===JK && !location.hash.startsWith("#e")) route(); });
async function boot(){
  try{ const r = await fetch("data.json"); const d = await r.json(); DATA=d; route(); }
  catch(e){ main.innerHTML=`<div class="empty">Impossible de charger les données. Ouvre l'appli une fois avec une connexion.</div>`; }
}
boot();
